services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reporadar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/greg-hass/reporadar:latest
    build: .   # used when building locally instead of pulling from GHCR
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reporadar}
      GITHUB_SERVER_TOKEN: ${GITHUB_SERVER_TOKEN}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 * * * *}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
