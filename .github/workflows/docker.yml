name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/greg-hass/reporadar

# Action refs are pinned to full commit SHAs (the tags they came from):
#   actions/checkout@v4              = 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4            = 49933ea5288caeca8642d1e84afbd3f7d6820020
#   docker/setup-buildx-action@v3    = 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action@v3           = c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/metadata-action@v5        = c299e40c65443455700f0fdfc63efafe5b349051
#   docker/build-push-action@v6      = 10e90e3645eae34f1e60eeb005ba3a3d33f178e8
#   actions/upload-artifact@v4       = ea165f8d65b6e75b540449e92b4886f43607fa02
#   actions/download-artifact@v4     = d3f86a106a0bac45b974a628896c90dbdf5c8093
# (zizmor/semgrep: mutable tags can be repointed — SHAs cannot.)

jobs:
  # Verification gate: every push to main, tag, and pull request must pass
  # tests, typechecks, and a production build before anything ships.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run build

  # Publish: only on pushes to main or version tags — never from PRs.
  # Native per-platform builders push by digest; the merge job assembles the
  # multi-arch manifest list so `latest`/semver/sha tags cover amd64 + arm64.
  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          args=()
          for digest in *; do
            args+=("${{ env.IMAGE }}@sha256:${digest}")
          done
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "${args[@]}"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest

      - name: Print immutable deployment reference
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')"
          echo "Deploy this reviewed image in Dockge:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
