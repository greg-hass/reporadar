name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/greg-hass/reporadar

# Action refs are pinned to full commit SHAs (the tags they came from):
#   actions/checkout@v4              = 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4            = 49933ea5288caeca8642d1e84afbd3f7d6820020
#   docker/setup-buildx-action@v3    = 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action@v3           = c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/metadata-action@v5        = c299e40c65443455700f0fdfc63efafe5b349051
#   docker/build-push-action@v6      = 10e90e3645eae34f1e60eeb005ba3a3d33f178e8
# (zizmor/semgrep: mutable tags can be repointed — SHAs cannot.)

jobs:
  # Verification gate: every push to main, tag, and pull request must pass
  # tests, typechecks, and a production build before anything ships.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run build

  # Publish: only on pushes to main or version tags — never from PRs.
  build-and-push:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
